# TLS settings shared by every HTTPS server block.
#
# TLS 1.2 is kept alongside 1.3: dropping it locks out older Android and any
# corporate middlebox that has not caught up, and 1.2 with these ciphers is
# still sound.
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling saves the visitor a round trip to the CA on first connect.
ssl_stapling        on;
ssl_stapling_verify on;
resolver            127.0.0.11 valid=60s ipv6=off;
resolver_timeout    5s;
