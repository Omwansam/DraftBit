# Response headers applied to both sites.
#
# No Content-Security-Policy here: the two apps have genuinely different needs
# (the public site loads Unsplash images and Google Fonts, the console does
# not), and one policy loose enough for both protects neither. Set it per app.

# 6 months, and deliberately without `preload`: preloading is effectively
# irreversible — it ships in browser binaries — and is not something to opt into
# as a side effect of a deploy.
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

# nginx advertises its exact version in errors otherwise.
server_tokens off;
