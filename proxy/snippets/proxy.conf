# Shared proxy_pass settings.
#
# Host is forwarded unchanged so the upstream sees the real domain — the API
# uses it to classify referrers, and the SPA containers use it for nothing but
# it costs nothing to be correct.
#
# X-Forwarded-For appends rather than replaces, and X-Forwarded-Proto is what
# lets the API know the original request was HTTPS even though this hop is
# plain HTTP inside the compose network. Both are why the API must be told how
# many proxy hops to trust (TRUST_PROXY).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Websockets are not used today, but leaving these out is the reason they
# mysteriously fail the first time someone adds them.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Do not hand the client a cached error page from a moment when the upstream
# was restarting.
proxy_next_upstream error timeout http_502 http_503 http_504;
