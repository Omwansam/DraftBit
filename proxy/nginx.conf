user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $request_time is appended to the standard combined format: without it
    # there is no way to tell a slow upstream from a slow client after the fact.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Long enough for a keep-alive to be worth reusing, short enough not to hold
    # sockets open for visitors who have gone.
    keepalive_timeout 65;

    # Websocket upgrade, mapped once here because proxy.conf references it in
    # every location. Without the map, $connection_upgrade is empty and nginx
    # sends `Connection: ` on ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml application/rss+xml;

    # Rendered from templates/ at container start.
    include /etc/nginx/conf.d/*.conf;
}
