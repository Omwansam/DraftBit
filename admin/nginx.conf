server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nothing here is large enough to stream, and compressing on the fly costs
    # less than the bytes saved on a first paint.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    # Vite fingerprints every asset it emits (index-4f2a1b.js), so those names
    # are safe to cache forever — a new build produces new names.
    location /assets/ {
        # One directive, one header: `expires 1y` would add a second
        # Cache-Control alongside this add_header rather than merging with it.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html is the one file that must never be cached: it is what points at
    # the fingerprinted bundles, so a stale copy pins a returning visitor to the
    # previous deploy's asset names, which no longer exist.
    location = /index.html {
        # `expires -1` is deliberately not used here: it emits a Cache-Control of
        # its own, and the response would go out carrying two of them.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # The API is reached through this origin instead of being called directly at
    # backend:5000, which makes every request same-origin: no preflight, no CORS
    # allow-list to keep in sync across two frontends, and cookies ride along
    # without SameSite exemptions. Set VITE_API_URL to the relative path /api/v1
    # for this to be used.
    #
    # The upstream is held in a variable so nginx resolves it per request via
    # Docker's embedded DNS. With a literal hostname nginx resolves at config
    # load and refuses to start when the backend is not up yet, which would make
    # the static site depend on the API being healthy just to serve HTML.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api backend:5000;
        proxy_pass http://$upstream_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # User-uploaded images are served by the API off its uploads volume.
    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_uploads backend:5000;
        proxy_pass http://$upstream_uploads$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
    }

    # react-router owns the URL space, so any path that is not a real file has to
    # return index.html — otherwise a deep link or a refresh on /projects/foo
    # 404s at the edge before the app ever boots.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
