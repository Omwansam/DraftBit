# DraftBit — port 80.
#
# Included into the FIBI edge proxy's http block (see deploy/vhosts in that
# stack's compose). FIBI already defines a port-80 server for its own domain;
# without this block a request for draftbitlabs.tech would fall through to it as
# the default server and be redirected to fibicommunity.org.
#
# Kept in a separate file from the HTTPS block on purpose: nginx refuses to
# start when a server block names a certificate that does not exist, and this
# block is what answers the ACME challenge that produces that certificate. The
# HTTPS file is added only once the certificate is on disk.

upstream draftbit_company {
    server draftbit-company:80;
    keepalive 16;
}

upstream draftbit_admin {
    server draftbit-admin:80;
    keepalive 16;
}

upstream draftbit_backend {
    server draftbit-backend:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name draftbitlabs.tech www.draftbitlabs.tech portal.draftbitlabs.tech;

    # Must stay on plain HTTP and must never redirect: Let's Encrypt validates
    # over port 80, and renewal happens when the current certificate is close to
    # expiry — exactly when a redirect to a soon-to-be-invalid certificate would
    # break it. Shares the webroot volume the certbot container writes into.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
