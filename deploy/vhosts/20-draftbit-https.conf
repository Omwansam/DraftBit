# DraftBit — port 443.
#
# Added only after /etc/letsencrypt/live/draftbitlabs.tech exists: nginx refuses
# to start when a server block names a certificate that is not on disk, and this
# proxy also serves fibicommunity.org — so a missing file here would take down a
# site that has nothing to do with DraftBit.
#
# Upstreams and the port-80 block are in 10-draftbit-http.conf.
#
# Inherited from the FIBI http block, deliberately not repeated here:
#   proxy_set_header Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto
#   the auth_limit and api_limit rate-limit zones
#   resolver, gzip, client_max_body_size
#
# X-Forwarded-For is OVERWRITTEN there rather than appended, so the API sees
# exactly one trusted address and TRUST_PROXY=1 is correct even behind
# Cloudflare.

# www -> apex, so cookies and analytics have a single origin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.draftbitlabs.tech;

    ssl_certificate     /etc/letsencrypt/live/draftbitlabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/draftbitlabs.tech/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    return 301 https://draftbitlabs.tech$request_uri;
}

# ------------------------------ Public site ------------------------------- #
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name draftbitlabs.tech;

    ssl_certificate     /etc/letsencrypt/live/draftbitlabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/draftbitlabs.tech/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn_limit 50;

    # Sign-in and the invite hand-off are the brute-forceable surface, so they
    # get the tighter bucket. The API enforces its own limits as well; this is
    # the cheaper outer layer that never reaches Node.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://draftbit_backend;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://draftbit_backend;
    }

    location /uploads/ {
        proxy_pass http://draftbit_backend;
        # Set explicitly rather than with `expires`, which would emit a second
        # Cache-Control header alongside this one.
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://draftbit_company;
    }
}

# ------------------------------ Admin console ------------------------------ #
#
# A separate origin from the public site on purpose: the console's session
# cookie is scoped to this host, so the marketing site can never send it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.draftbitlabs.tech;

    ssl_certificate     /etc/letsencrypt/live/draftbitlabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/draftbitlabs.tech/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Staff-only. Keep it out of search results entirely.
    add_header X-Robots-Tag              "noindex, nofollow" always;

    limit_conn conn_limit 50;

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://draftbit_backend;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://draftbit_backend;
    }

    location /uploads/ {
        proxy_pass http://draftbit_backend;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://draftbit_admin;
    }
}
